# Configuracion Robolectric para tests que ejercen Room via el singleton
# BaseDatosSeguridad.get(context) (ej: DenunciarScreenTest).
#
# sqliteMode = NATIVE hace que Robolectric use una instancia real de
# SQLite embebida (org.sqlite / JDBC) en vez del ShadowLegacySQLiteConnection
# que simula la API nativa de Android. El shadow legacy falla con
# "Illegal connection pointer" cuando un Flow de Room observa en un
# hilo de IO (arch_disk_io_*) y el test assertion corre en otro hilo,
# porque el shadow mantiene punteros de conexion por hilo y los cross-
# thread access lanza IllegalStateException.
#
# Con NATIVE, la conexion SQLite es un puente JDBC y los accesos cross-
# thread son seguros (Room maneja el threading internamente).
#
# Esto no afecta a los tests que ya usan Room.inMemoryDatabaseBuilder()
# directamente (RegistrarEscaneoLocalTest, ClearAllTablesTest,
# OrphanCleanupTest) — ellos ya funcionan con el shadow legacy porque
# sus DAOs se ejecutan sincronamente en el mismo hilo del test.
sqliteMode = NATIVE
