# ──────────────────────────────────────────────────────────────────────────
# Version Catalog — QRSecurityDetector
# Single source of truth for all dependencies, plugins, and versions.
# Extracted from app/build.gradle.kts inline declarations.
# ──────────────────────────────────────────────────────────────────────────

[versions]
# Build tooling
agp = "8.2.0"
kotlin = "1.9.22"
ksp = "1.9.22-1.0.17"

# AndroidX Core
coreKtx = "1.12.0"
material = "1.11.0"
activityCompose = "1.8.2"
lifecycle = "2.7.0"

# Compose (BOM-aligned)
composeBom = "2024.03.00"
composeCompiler = "1.5.8"

# Navigation
navigationCompose = "2.7.7"

# Room
room = "2.6.1"

# WorkManager
work = "2.9.0"

# Coroutines
coroutines = "1.7.3"
serializationJson = "1.6.2"

# OkHttp
okhttp = "4.12.0"

# Security Crypto (EncryptedSharedPreferences)
securityCrypto = "1.1.0-alpha06"

# CameraX
camerax = "1.3.1"

# ML Kit Barcode
mlkitBarcode = "17.2.0"

# TensorFlow Lite
tensorflow = "2.17.0"

# Hilt
hilt = "2.50"
hiltNavigationCompose = "1.2.0"
hiltWork = "1.2.0"

# Testing
junit = "4.13.2"
kotlinTest = "1.9.22"
robolectric = "4.11.1"
androidxTestCore = "1.5.0"
androidxTestJunit = "1.1.5"
coroutinesTest = "1.7.3"
mockwebserver = "4.12.0"

