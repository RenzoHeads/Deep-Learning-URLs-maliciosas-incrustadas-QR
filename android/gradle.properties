# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon — increase heap for large builds.
# 4g: R8 (assembleRelease, minifyEnabled) con CameraX + ML Kit + TFLite +
# Compose excedia los 2048m y mataba el daemon con OOM a mitad del build
# (verificado 2026-08-23: daemon 23148 "ran out of JVM heap space").
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX package structure — required for AndroidX libraries.
android.useAndroidX=true

# Kotlin code style for this project.
kotlin.code.style=official

# Enables namespaming of each library's R class.
android.nonTransitiveRClass=true

# Performance: parallel + cached builds. (Audit fix: se elimino
# org.gradle.configureondemand — deprecado y sin efecto con un solo modulo.)
org.gradle.parallel=true
org.gradle.caching=true

# Audit fix: AGP 8.2.0 solo fue probado hasta compileSdk 34; el proyecto
# compila contra 35. Suprimimos el warning de forma explicita hasta el
# upgrade de AGP (el build ya pasaba — esto documenta la decision).
android.suppressUnsupportedCompileSdk=35
