# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon — increase heap for large builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX package structure — required for AndroidX libraries.
android.useAndroidX=true

# Kotlin code style for this project.
kotlin.code.style=official

# Enables namespaming of each library's R class.
android.nonTransitiveRClass=true

# Performance: configure on demand + parallel builds.
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true

# Disable build features we don't use to speed up builds.
android.defaults.buildfeatures.buildconfig=false
