[project]
name = "qr-guardian-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "asyncpg==0.30.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    "pyjwt[crypto]==2.13.0",
    "httpx==0.28.1",
    "email-validator==2.3.0",
]

# Unica fuente de verdad de dependencias (Vercel construye desde aqui;
# el antiguo requirements.txt duplicaba estos pins y divergio).
# Local: pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]
