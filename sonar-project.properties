# --- SonarQube Cloud configuration ---
sonar.organization=renzoheads
sonar.projectKey=RenzoHeads_Deep-Learning-URLs-maliciosas-incrustadas-QR
sonar.projectName=Deep-Learning-URLs-maliciosas-incrustadas-QR
sonar.projectVersion=1.0

# Source paths — multi-language project (Kotlin + Python)
sonar.sources=android/app/src/main/java,backend/app
sonar.tests=android/app/src/test/java,backend/tests

# Exclusions: build artifacts, config files, Jupyter notebooks, data directories
sonar.exclusions=**/build/**,**/*.json,**/*.xml,**/*.pro,backend/api/**,*.ipynb,**/*.ipynb,master_generico/**,master_regionalizado/**,prueba_generica/**,prueba_latam/**

# Python specific (backend requires-python >= 3.12)
sonar.python.version=3.12

# Audit fix: se elimino `sonar.coverage.exclusions=**/*` — su premisa
# ("sin tests en el proyecto") es falsa: hay 270+ tests JVM en
# android/app/src/test y 70+ en backend/tests.

# Encoding
sonar.sourceEncoding=UTF-8
