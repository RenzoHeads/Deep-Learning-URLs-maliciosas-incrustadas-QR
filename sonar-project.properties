# --- SonarCloud configuration ---
sonar.organization=renzoheads
sonar.projectKey=qr-guardian
sonar.projectName=QR Guardian
sonar.projectVersion=1.0

# Source paths
sonar.sources=android/app/src/main/java,backend/app
sonar.tests=android/app/src/test/java,backend/tests

# Language
sonar.language=kotlin

# Exclusions
sonar.exclusions=**/build/**,**/*.json,**/*.xml,**/*.pro,backend/api/**

# Kotlin specific
sonar.kotlin.coverage.jacoco.xmlReportPaths=android/app/build/reports/jacoco/**/*.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Branch
sonar.branch=main
